services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_range}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cyber_range}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: ${KEYCLOAK_IMAGE:-vdagxumcha4qdz-quay.xuanyuan.dev/keycloak/keycloak:26.1.4}
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: ${KEYCLOAK_FEATURES:-token-exchange,admin-fine-grained-authz}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro

  keycloak-bootstrap:
    image: ${KEYCLOAK_IMAGE:-vdagxumcha4qdz-quay.xuanyuan.dev/keycloak/keycloak:26.1.4}
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ["/bin/sh", "/opt/keycloak/bootstrap-keycloak.sh"]
    environment:
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-cyber-range}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      PLATFORM_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      PLATFORM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-platform-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-platform-admin-dev-only}
      MCP_OIDC_CLIENT_ID: ${MCP_OIDC_CLIENT_ID:-mcp-gateway}
      MCP_OIDC_CLIENT_SECRET: ${MCP_OIDC_CLIENT_SECRET:-mcp-gateway-dev-only}
      MCP_SMOKE_CLIENT_ID: ${MCP_SMOKE_CLIENT_ID:-smoke-conf}
      MCP_SMOKE_CLIENT_SECRET: ${MCP_SMOKE_CLIENT_SECRET:-smoke-secret}
      MCP_SMOKE_OIDC_CLIENT_ID: ${MCP_SMOKE_OIDC_CLIENT_ID:-mcp-smoke-sa}
      MCP_SMOKE_OIDC_CLIENT_SECRET: ${MCP_SMOKE_OIDC_CLIENT_SECRET:-mcp-smoke-secret}
    volumes:
      - ./scripts/dev/bootstrap-keycloak.sh:/opt/keycloak/bootstrap-keycloak.sh:ro

  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        OPENTOFU_IMAGE: ${OPENTOFU_IMAGE:-ghcr.io/opentofu/opentofu:1.13.1-minimal}
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
        PNPM_FETCH_RETRIES: ${PNPM_FETCH_RETRIES:-10}
        PNPM_FETCH_RETRY_MIN_TIMEOUT: ${PNPM_FETCH_RETRY_MIN_TIMEOUT:-2000}
        PNPM_FETCH_RETRY_MAX_TIMEOUT: ${PNPM_FETCH_RETRY_MAX_TIMEOUT:-30000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/${KEYCLOAK_REALM:-cyber-range}}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-cyber-range}/protocol/openid-connect/certs}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-cyber-range}/protocol/openid-connect/token}
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-platform-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-platform-admin-dev-only}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-cyber-range}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cyber_range}?schema=public
      RANGE_PROVISIONER_MODE: ${RANGE_PROVISIONER_MODE:-opentofu}
      BILLING_SYNC_INTERVAL_MS: ${BILLING_SYNC_INTERVAL_MS:-21600000}
      PROVISIONING_WORKER_RANGE_CONCURRENCY: ${PROVISIONING_WORKER_RANGE_CONCURRENCY:-2}
      PROVISIONING_WORKER_SINGLE_BATCH_CONCURRENCY: ${PROVISIONING_WORKER_SINGLE_BATCH_CONCURRENCY:-3}
      RANGE_CIDR_POOL: ${RANGE_CIDR_POOL:-10.80.0.0/16,10.81.0.0/16}
      OPENTOFU_BINARY: ${OPENTOFU_BINARY:-tofu}
      OPENTOFU_PARALLELISM: ${OPENTOFU_PARALLELISM:-10}
      OPENTOFU_SINGLE_INSTANCE_PARALLELISM: ${OPENTOFU_SINGLE_INSTANCE_PARALLELISM:-20}
      ALICLOUD_PROVIDER_VERSION: ${ALICLOUD_PROVIDER_VERSION:-1.282.0-range.1}
      ALICLOUD_PROVIDER_SHA256: ${ALICLOUD_PROVIDER_SHA256:-}
      OPENTOFU_WORKSPACES_ROOT: /var/lib/cyber-range/workspaces
      OPENTOFU_PROVIDER_MIRROR_ROOT: /var/lib/cyber-range/provider-mirror
      OPENTOFU_INSTANCE_TYPE: ${OPENTOFU_INSTANCE_TYPE:-auto}
      OPENTOFU_INSTANCE_TYPE_PREFERENCES: ${OPENTOFU_INSTANCE_TYPE_PREFERENCES:-}
      OPENTOFU_IMAGE_ID: ${OPENTOFU_IMAGE_ID:-}
      OPENTOFU_ALLOWED_INGRESS_CIDR: ${OPENTOFU_ALLOWED_INGRESS_CIDR:-0.0.0.0/0}
      OPENTOFU_SYSTEM_DISK_CATEGORY: ${OPENTOFU_SYSTEM_DISK_CATEGORY:-cloud_essd}
      OPENTOFU_SYSTEM_DISK_SIZE: ${OPENTOFU_SYSTEM_DISK_SIZE:-40}
      OPENTOFU_INTERNET_MAX_BANDWIDTH_OUT: ${OPENTOFU_INTERNET_MAX_BANDWIDTH_OUT:-10}
      ALICLOUD_ACCESS_KEY: ${ALICLOUD_ACCESS_KEY:-}
      ALICLOUD_SECRET_KEY: ${ALICLOUD_SECRET_KEY:-}
      PLATFORM_IMAGE_SECRET_KEY: ${PLATFORM_IMAGE_SECRET_KEY:-change-this-before-production}
      IMAGE_IMPORT_ALLOWED_ORIGINS: ${IMAGE_IMPORT_ALLOWED_ORIGINS:-http://localhost:3000}
      ALICLOUD_REGION: ${ALICLOUD_REGION:-cn-hangzhou}
      ALICLOUD_ZONE_ID: ${ALICLOUD_ZONE_ID:-cn-hangzhou-h}
      ALICLOUD_IMAGE_ID: ${ALICLOUD_IMAGE_ID:-}
      ALICLOUD_INSTANCE_TYPE: ${ALICLOUD_INSTANCE_TYPE:-auto}
      ALICLOUD_INSTANCE_TYPE_PREFERENCES: ${ALICLOUD_INSTANCE_TYPE_PREFERENCES:-}
      ALICLOUD_RANGE_VPC_CIDR: ${ALICLOUD_RANGE_VPC_CIDR:-10.70.0.0/16}
      ALICLOUD_RANGE_DMZ_CIDR: ${ALICLOUD_RANGE_DMZ_CIDR:-10.70.10.0/24}
      ALICLOUD_RANGE_OFFICE_CIDR: ${ALICLOUD_RANGE_OFFICE_CIDR:-10.70.20.0/24}
      ALICLOUD_RANGE_SERVER_CIDR: ${ALICLOUD_RANGE_SERVER_CIDR:-10.70.30.0/24}
      ALICLOUD_RANGE_DMZ_PRIVATE_IP: ${ALICLOUD_RANGE_DMZ_PRIVATE_IP:-10.70.10.10}
      ALICLOUD_RANGE_OFFICE_PRIVATE_IP: ${ALICLOUD_RANGE_OFFICE_PRIVATE_IP:-10.70.20.10}
      ALICLOUD_RANGE_SERVER_PRIVATE_IP: ${ALICLOUD_RANGE_SERVER_PRIVATE_IP:-10.70.30.10}
      ALICLOUD_PROVIDER_ZIP_PATH: /var/lib/cyber-range/provider-mirror/registry.opentofu.org/aliyun/alicloud/terraform-provider-alicloud_${ALICLOUD_PROVIDER_VERSION:-1.282.0-range.1}_linux_amd64.zip
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    volumes:
      - opentofu-workspaces:/var/lib/cyber-range/workspaces
      - ${OPENTOFU_PROVIDER_MIRROR_HOST_PATH:-./.local/provider-fast-wait/mirror}:/var/lib/cyber-range/provider-mirror:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  provisioner-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        OPENTOFU_IMAGE: ${OPENTOFU_IMAGE:-ghcr.io/opentofu/opentofu:1.13.1-minimal}
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
        PNPM_FETCH_RETRIES: ${PNPM_FETCH_RETRIES:-10}
        PNPM_FETCH_RETRY_MIN_TIMEOUT: ${PNPM_FETCH_RETRY_MIN_TIMEOUT:-2000}
        PNPM_FETCH_RETRY_MAX_TIMEOUT: ${PNPM_FETCH_RETRY_MAX_TIMEOUT:-30000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["node", "apps/api/dist/apps/api/src/worker-main.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cyber_range}?schema=public
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/${KEYCLOAK_REALM:-cyber-range}}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-cyber-range}/protocol/openid-connect/certs}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-cyber-range}/protocol/openid-connect/token}
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-platform-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-platform-admin-dev-only}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-cyber-range}
      RANGE_PROVISIONER_MODE: ${RANGE_PROVISIONER_MODE:-opentofu}
      BILLING_SYNC_INTERVAL_MS: "0"
      PROVISIONING_WORKER_RANGE_CONCURRENCY: ${PROVISIONING_WORKER_RANGE_CONCURRENCY:-2}
      PROVISIONING_WORKER_SINGLE_BATCH_CONCURRENCY: ${PROVISIONING_WORKER_SINGLE_BATCH_CONCURRENCY:-3}
      OPENTOFU_BINARY: ${OPENTOFU_BINARY:-tofu}
      OPENTOFU_PARALLELISM: ${OPENTOFU_PARALLELISM:-10}
      OPENTOFU_SINGLE_INSTANCE_PARALLELISM: ${OPENTOFU_SINGLE_INSTANCE_PARALLELISM:-20}
      ALICLOUD_PROVIDER_VERSION: ${ALICLOUD_PROVIDER_VERSION:-1.282.0-range.1}
      ALICLOUD_PROVIDER_SHA256: ${ALICLOUD_PROVIDER_SHA256:-}
      OPENTOFU_WORKSPACES_ROOT: /var/lib/cyber-range/workspaces
      OPENTOFU_PROVIDER_MIRROR_ROOT: /var/lib/cyber-range/provider-mirror
      OPENTOFU_INSTANCE_TYPE: ${OPENTOFU_INSTANCE_TYPE:-auto}
      OPENTOFU_INSTANCE_TYPE_PREFERENCES: ${OPENTOFU_INSTANCE_TYPE_PREFERENCES:-}
      OPENTOFU_IMAGE_ID: ${OPENTOFU_IMAGE_ID:-}
      OPENTOFU_ALLOWED_INGRESS_CIDR: ${OPENTOFU_ALLOWED_INGRESS_CIDR:-0.0.0.0/0}
      OPENTOFU_SYSTEM_DISK_CATEGORY: ${OPENTOFU_SYSTEM_DISK_CATEGORY:-cloud_essd}
      OPENTOFU_SYSTEM_DISK_SIZE: ${OPENTOFU_SYSTEM_DISK_SIZE:-40}
      OPENTOFU_INTERNET_MAX_BANDWIDTH_OUT: ${OPENTOFU_INTERNET_MAX_BANDWIDTH_OUT:-10}
      ALICLOUD_ACCESS_KEY: ${ALICLOUD_ACCESS_KEY:-}
      ALICLOUD_SECRET_KEY: ${ALICLOUD_SECRET_KEY:-}
      PLATFORM_IMAGE_SECRET_KEY: ${PLATFORM_IMAGE_SECRET_KEY:-change-this-before-production}
      IMAGE_IMPORT_ALLOWED_ORIGINS: ${IMAGE_IMPORT_ALLOWED_ORIGINS:-http://localhost:3000}
      ALICLOUD_REGION: ${ALICLOUD_REGION:-cn-hangzhou}
      ALICLOUD_ZONE_ID: ${ALICLOUD_ZONE_ID:-cn-hangzhou-h}
      ALICLOUD_IMAGE_ID: ${ALICLOUD_IMAGE_ID:-}
      ALICLOUD_INSTANCE_TYPE: ${ALICLOUD_INSTANCE_TYPE:-auto}
      ALICLOUD_INSTANCE_TYPE_PREFERENCES: ${ALICLOUD_INSTANCE_TYPE_PREFERENCES:-}
      ALICLOUD_PROVIDER_ZIP_PATH: /var/lib/cyber-range/provider-mirror/registry.opentofu.org/aliyun/alicloud/terraform-provider-alicloud_${ALICLOUD_PROVIDER_VERSION:-1.282.0-range.1}_linux_amd64.zip
    volumes:
      - opentofu-workspaces:/var/lib/cyber-range/workspaces
      - ${OPENTOFU_PROVIDER_MIRROR_HOST_PATH:-./.local/provider-fast-wait/mirror}:/var/lib/cyber-range/provider-mirror:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-http://localhost:8080/realms/${KEYCLOAK_REALM:-cyber-range}}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-platform-web}
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
        PNPM_FETCH_RETRIES: ${PNPM_FETCH_RETRIES:-10}
        PNPM_FETCH_RETRY_MIN_TIMEOUT: ${PNPM_FETCH_RETRY_MIN_TIMEOUT:-2000}
        PNPM_FETCH_RETRY_MAX_TIMEOUT: ${PNPM_FETCH_RETRY_MAX_TIMEOUT:-30000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WEB_PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-http://localhost:8080/realms/${KEYCLOAK_REALM:-cyber-range}}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-platform-web}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
      args:
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
        PNPM_FETCH_RETRIES: ${PNPM_FETCH_RETRIES:-10}
        PNPM_FETCH_RETRY_MIN_TIMEOUT: ${PNPM_FETCH_RETRY_MIN_TIMEOUT:-2000}
        PNPM_FETCH_RETRY_MAX_TIMEOUT: ${PNPM_FETCH_RETRY_MAX_TIMEOUT:-30000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cyber_range}?schema=public
      PLATFORM_API_BASE_URL: http://api:3001
      MCP_STATIC_BEARER_TOKEN: ${MCP_STATIC_BEARER_TOKEN:-}
      MCP_STATIC_SCOPES: ${MCP_STATIC_SCOPES:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/${KEYCLOAK_REALM:-cyber-range}}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-cyber-range}/protocol/openid-connect/certs}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-cyber-range}/protocol/openid-connect/token}
      MCP_OIDC_CLIENT_ID: ${MCP_OIDC_CLIENT_ID:-mcp-gateway}
      MCP_OIDC_CLIENT_SECRET: ${MCP_OIDC_CLIENT_SECRET:-mcp-gateway-dev-only}
      MCP_OIDC_AUDIENCE: ${MCP_OIDC_AUDIENCE:-mcp-gateway}
      PLATFORM_API_AUDIENCE: ${PLATFORM_API_AUDIENCE:-platform-api}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-cyber-range}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8787/mcp}
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    profiles: ["quick-tunnel"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      web:
        condition: service_started
      mcp:
        condition: service_started
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

  cloudflared:
    profiles: ["quick-tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://caddy:80"]

  caddy-direct:
    profiles: ["direct-tls"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      web:
        condition: service_started
      mcp:
        condition: service_started
    environment:
      CADDY_PUBLIC_HOST: ${CADDY_PUBLIC_HOST:-localhost}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.direct", "--adapter", "caddyfile"]
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile.direct:/etc/caddy/Caddyfile.direct:ro

volumes:
  postgres-data:
  keycloak-postgres-data:
  opentofu-workspaces:
