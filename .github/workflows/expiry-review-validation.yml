name: Expiry review baseline
on:
  push:
    branches: [codex/expiry-cost-guardrails-20261011]
    paths: [.github/workflows/expiry-review-validation.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dba463f204cbe11354fba73c7d73017d13ee9cce
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/expiry-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: expiry-source-dba463f
          path: /tmp/expiry-source.tar.gz
          retention-days: 1
