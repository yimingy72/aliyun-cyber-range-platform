name: Lifecycle review validation
on:
  push:
    branches: [codex/lifecycle-billing-review-20261011]
    paths: [.github/workflows/review-source-snapshot.yml, .github/lifecycle-review.patch]
permissions:
  contents: read
concurrency:
  group: lifecycle-review-validation
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/codex/lifecycle-billing-review-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      REVIEW_BASE: 062330497978375a99fa3b12c8d2396713547348
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lifecycle-billing-review-20261011
          fetch-depth: 0
      - name: Apply the reviewed patch to its exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object .github/lifecycle-review.patch)" = e4139b0ae1f88d014f4edb6de35f833ff0fda843
          git diff --quiet "$REVIEW_BASE" -- apps packages infra scripts test docs
          git apply --check .github/lifecycle-review.patch
          git apply .github/lifecycle-review.patch
          git add -N apps/api/test/aliyun-reconciliation-timeout.spec.ts apps/api/test/billing-bss-integrity.spec.ts docs/reviews/2026-10-11-lifecycle-billing.md
          git diff --check
          mkdir -p "$RUNNER_TEMP/review-results" "$RUNNER_TEMP/review-baseline"
          git diff --binary > "$RUNNER_TEMP/review-results/validated.patch"
          git show "$REVIEW_BASE:apps/api/src/admin/billing-bss-client.ts" > "$RUNNER_TEMP/review-baseline/billing-bss-client.ts"
          git show "$REVIEW_BASE:apps/api/src/provisioning/platform-resource-reconciliation.service.ts" > "$RUNNER_TEMP/review-baseline/platform-resource-reconciliation.service.ts"
      - name: Free disk for container validation
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/cache@v4
        with:
          path: .local/provider-fast-wait/cache
          key: ${{ runner.os }}-alicloud-fast-wait-${{ hashFiles('scripts/provider/alicloud-fast-wait/**') }}
      - uses: actions/cache@v4
        with:
          path: .local/tencentcloud-idempotency
          key: ${{ runner.os }}-tencentcloud-provider-${{ hashFiles('scripts/provider/tencentcloud-idempotency/*') }}
      - name: Build the repository test container
        run: docker build -f scripts/ci/Dockerfile -t "cyber-range-review:$GITHUB_RUN_ID" .
      - name: Fixed code must pass the targeted regressions in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -e NODE_ENV=test -e RANGE_PROVISIONER_MODE=dry-run \
            -v "$RUNNER_TEMP/review-results:/results" "cyber-range-review:$GITHUB_RUN_ID" sh -ec '
              pnpm --filter @aliyun-cyber-range/api test --runTestsByPath \
                test/billing-bss-integrity.spec.ts test/aliyun-reconciliation-timeout.spec.ts \
                test/platform-resource-reconciliation.service.spec.ts test/billing-safety.spec.ts \
                --json --outputFile=/results/fixed.json
            ' 2>&1 | tee "$RUNNER_TEMP/review-results/fixed.log"
      - name: Original source must reproduce the new regression failures in Docker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network none -e NODE_ENV=test -e RANGE_PROVISIONER_MODE=dry-run \
            -v "$RUNNER_TEMP/review-results:/results" \
            -v "$RUNNER_TEMP/review-baseline/billing-bss-client.ts:/app/apps/api/src/admin/billing-bss-client.ts:ro" \
            -v "$RUNNER_TEMP/review-baseline/platform-resource-reconciliation.service.ts:/app/apps/api/src/provisioning/platform-resource-reconciliation.service.ts:ro" \
            "cyber-range-review:$GITHUB_RUN_ID" sh -ec '
              pnpm --filter @aliyun-cyber-range/api test --runTestsByPath \
                test/billing-bss-integrity.spec.ts test/aliyun-reconciliation-timeout.spec.ts \
                test/platform-resource-reconciliation.service.spec.ts --json --outputFile=/results/baseline.json
            ' 2>&1 | tee "$RUNNER_TEMP/review-results/baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          results = json.loads((Path(os.environ['RUNNER_TEMP']) / 'review-results/baseline.json').read_text())
          expected = {
              'billing-bss-integrity.spec.ts': 'retains existing charges when the total is missing',
              'aliyun-reconciliation-timeout.spec.ts': 'cancels a stalled',
              'platform-resource-reconciliation.service.spec.ts': 'does not adopt an unrecorded physical ECS',
          }
          for name, title in expected.items():
              suite = next(result for result in results['testResults'] if Path(result['name']).name == name)
              assert any(test['status'] == 'failed' and title in test['fullName'] for test in suite['assertionResults']), name
          print('Original source reproduces assertion failures for all three reviewed defects.')
          PY
      - name: Full repository tests, production build, migrations and offline IaC in Docker
        shell: bash
        run: |
          set -euo pipefail
          CI_BASE_IMAGE="cyber-range-review:$GITHUB_RUN_ID" bash scripts/ci/verify-docker.sh 2>&1 | tee "$RUNNER_TEMP/review-results/full-validation.log"
      - name: Publish only the validated changes and remove review staging files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add apps/api/src/admin/billing-bss-client.ts apps/api/src/provisioning/platform-resource-reconciliation.service.ts \
            apps/api/test/aliyun-reconciliation-timeout.spec.ts apps/api/test/billing-bss-integrity.spec.ts \
            apps/api/test/billing-safety.spec.ts apps/api/test/platform-resource-reconciliation.service.spec.ts \
            docs/reviews/2026-10-11-lifecycle-billing.md
          git rm .github/lifecycle-review.patch .github/workflows/review-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve billing ownership and bound lifecycle reconciliation'
          git push origin HEAD:refs/heads/codex/lifecycle-billing-review-20261011
          git rev-parse HEAD | tee "$RUNNER_TEMP/review-results/validated-commit.txt"
          git diff --stat "$REVIEW_BASE" HEAD | tee "$RUNNER_TEMP/review-results/diff-stat.txt"
          git ls-tree -r HEAD -- apps/api/src/admin/billing-bss-client.ts apps/api/src/provisioning/platform-resource-reconciliation.service.ts \
            apps/api/test/aliyun-reconciliation-timeout.spec.ts apps/api/test/billing-bss-integrity.spec.ts \
            apps/api/test/billing-safety.spec.ts apps/api/test/platform-resource-reconciliation.service.spec.ts \
            docs/reviews/2026-10-11-lifecycle-billing.md > "$RUNNER_TEMP/review-results/validated-blobs.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-review-validation
          path: ${{ runner.temp }}/review-results/
          retention-days: 7
