name: Container verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache pinned provider source and Go build artifacts
        uses: actions/cache@v4
        with:
          path: .local/provider-fast-wait/cache
          key: ${{ runner.os }}-alicloud-fast-wait-${{ hashFiles('scripts/provider/alicloud-fast-wait/**') }}
      - name: Test, build and validate in Docker
        run: bash scripts/ci/verify-docker.sh
